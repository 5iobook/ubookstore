server:
  port: 8081

spring:
  application:
    name: post
  datasource:
    url: jdbc:mysql://localhost:3306/post_db?serverTimezone=Asia/Seoul
    username: post_user
    password: post_pw
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  h2:
    console:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/