events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로그 설정
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 기본 설정
    sendfile on;
    keepalive_timeout 65;
    gzip on;

    # 업스트림 서버 정의
    upstream book-frontend {
        server book-frontend:80;
    }

    upstream trade-frontend {
        server trade-frontend:80;
    }

    # 메인 서버 블록
    server {
        listen 80;
        server_name localhost;

        # Book 프론트엔드
        location /book {
            proxy_pass http://book-frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # /book 경로를 제거하고 프론트엔드로 전달
            rewrite ^/book/(.*)$ /$1 break;
            rewrite ^/book$ / break;
        }

        # Trade 프론트엔드
        location /trade {
            proxy_pass http://trade-frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # /trade 경로를 제거하고 프론트엔드로 전달
            rewrite ^/trade/(.*)$ /$1 break;
            rewrite ^/trade$ / break;
        }

        # 루트 경로 - 간단한 인덱스 페이지
        location = / {
            return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Bookstore</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        h1 { color: #1976d2; }
        .links { margin-top: 30px; }
        .links a { display: block; padding: 15px; margin: 10px 0; background: #f0f4f8; border-radius: 8px; text-decoration: none; color: #1976d2; font-weight: 500; }
        .links a:hover { background: #e3f2fd; }
    </style>
</head>
<body>
    <h1>📚 Bookstore Microservices</h1>
    <p>마이크로서비스 기반 서점 애플리케이션</p>
    <div class="links">
        <a href="/book">📖 Book Service - 도서 관리</a>
        <a href="/trade">🤝 Trade Service - 거래 관리</a>
    </div>
</body>
</html>';
            add_header Content-Type text/html;
        }

        # 헬스체크
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
