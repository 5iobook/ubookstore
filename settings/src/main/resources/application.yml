server:
  port: 8088

spring:
  application:
    name: settings-service
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore_settings?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: bookstore_user
    password: bookstore_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.bookstore.settings: DEBUG
    org.springframework.web: DEBUG